[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-recovery"
version = "0.1.0"
description = "ECHO — Autonomous Data Recovery"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.54.0",
  "streamlit>=1.39.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
echo-worker = "echo.worker.main:main"
echo-reset-demo = "echo.cli:reset_demo"

[project.entry-points.streamlit]
echo-control-center = "echo.ui.app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo = ["db/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
